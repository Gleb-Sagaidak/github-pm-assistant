services:
  postgres:
    image: postgres:17
    container_name: pmassistant-postgres
    environment:
      POSTGRES_DB: pmassistant
      POSTGRES_USER: ${DB_USER:-pmassistant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pmassistant}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pmassistant} -d pmassistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
