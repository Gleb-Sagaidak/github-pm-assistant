<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="990" viewBox="0 0 1320 990" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#707070"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="990" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="22" font-weight="bold" fill="#222222">Container diagram — GitHub PM Assistant</text>
  <text x="40" y="66" font-size="13" fill="#666666">C4 model, level 2</text>

  <!-- ============ Persons ============ -->
  <!-- Team Lead -->
  <g>
    <rect x="150" y="140" width="200" height="118" rx="28" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/>
    <circle cx="250" cy="116" r="30" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/>
    <text x="250" y="174" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Team Lead</text>
    <text x="250" y="192" font-size="12" fill="#D6E2F0" text-anchor="middle">[Person]</text>
    <text x="250" y="214" font-size="12.5" fill="#ffffff" text-anchor="middle">Lead of a small team who</text>
    <text x="250" y="230" font-size="12.5" fill="#ffffff" text-anchor="middle">also manages the project</text>
    <text x="250" y="246" font-size="12.5" fill="#ffffff" text-anchor="middle">in GitHub.</text>
  </g>

  <!-- Developer / Evaluator -->
  <g>
    <rect x="540" y="140" width="200" height="118" rx="28" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/>
    <circle cx="640" cy="116" r="30" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/>
    <text x="640" y="174" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Developer / Evaluator</text>
    <text x="640" y="192" font-size="12" fill="#D6E2F0" text-anchor="middle">[Person]</text>
    <text x="640" y="214" font-size="12.5" fill="#ffffff" text-anchor="middle">Runs the agents on prepared</text>
    <text x="640" y="230" font-size="12.5" fill="#ffffff" text-anchor="middle">scenarios and evaluates</text>
    <text x="640" y="246" font-size="12.5" fill="#ffffff" text-anchor="middle">their output.</text>
  </g>

  <!-- Team Member -->
  <g>
    <rect x="1050" y="140" width="200" height="118" rx="28" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/>
    <circle cx="1150" cy="116" r="30" fill="#08427B" stroke="#073B6F" stroke-width="1.5"/>
    <text x="1150" y="174" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Team Member</text>
    <text x="1150" y="192" font-size="12" fill="#D6E2F0" text-anchor="middle">[Person]</text>
    <text x="1150" y="214" font-size="12.5" fill="#ffffff" text-anchor="middle">Writes issues and comments;</text>
    <text x="1150" y="230" font-size="12.5" fill="#ffffff" text-anchor="middle">does not use the system</text>
    <text x="1150" y="246" font-size="12.5" fill="#ffffff" text-anchor="middle">directly.</text>
  </g>

  <!-- ============ System boundary ============ -->
  <rect x="90" y="330" width="720" height="570" rx="10" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="110" y="872" font-size="15" font-weight="bold" fill="#444444">GitHub PM Assistant</text>
  <text x="110" y="888" font-size="12" fill="#666666">[Software System]</text>

  <!-- ============ Containers ============ -->
  <!-- Web App -->
  <g>
    <rect x="130" y="400" width="240" height="150" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/>
    <text x="250" y="430" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Web App</text>
    <text x="250" y="448" font-size="12" fill="#E3EEF9" text-anchor="middle">[Container: TypeScript, React]</text>
    <text x="250" y="472" font-size="12.5" fill="#ffffff" text-anchor="middle">Single-page app: shows proposals</text>
    <text x="250" y="488" font-size="12.5" fill="#ffffff" text-anchor="middle">with justification, agent steps</text>
    <text x="250" y="504" font-size="12.5" fill="#ffffff" text-anchor="middle">and the original issue text; lets</text>
    <text x="250" y="520" font-size="12.5" fill="#ffffff" text-anchor="middle">the lead approve or reject them.</text>
  </g>

  <!-- Backend Application -->
  <g>
    <rect x="500" y="400" width="280" height="160" rx="8" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/>
    <text x="640" y="430" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Backend Application</text>
    <text x="640" y="448" font-size="12" fill="#E3EEF9" text-anchor="middle">[Container: Java, Spring Boot]</text>
    <text x="640" y="472" font-size="12.5" fill="#ffffff" text-anchor="middle">REST API and webhook endpoint. Runs</text>
    <text x="640" y="488" font-size="12.5" fill="#ffffff" text-anchor="middle">the triage and progress agents (on</text>
    <text x="640" y="504" font-size="12.5" fill="#ffffff" text-anchor="middle">demand, on new issues, on a schedule),</text>
    <text x="640" y="520" font-size="12.5" fill="#ffffff" text-anchor="middle">validates proposals and applies only</text>
    <text x="640" y="536" font-size="12.5" fill="#ffffff" text-anchor="middle">approved actions.</text>
  </g>

  <!-- Database (cylinder) -->
  <g>
    <path d="M500,674 L500,806 A110,14 0 0 0 720,806 L720,674 Z" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/>
    <ellipse cx="610" cy="674" rx="110" ry="14" fill="#438DD5" stroke="#3C7FC0" stroke-width="1.5"/>
    <text x="610" y="712" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Database</text>
    <text x="610" y="730" font-size="12" fill="#E3EEF9" text-anchor="middle">[Container: PostgreSQL]</text>
    <text x="610" y="754" font-size="12.5" fill="#ffffff" text-anchor="middle">Agent runs with steps and</text>
    <text x="610" y="770" font-size="12.5" fill="#ffffff" text-anchor="middle">metrics, proposals, decisions;</text>
    <text x="610" y="786" font-size="12.5" fill="#ffffff" text-anchor="middle">append-only audit log.</text>
  </g>

  <!-- ============ External systems ============ -->
  <!-- GitHub -->
  <g>
    <rect x="1020" y="400" width="260" height="150" rx="8" fill="#999999" stroke="#8A8A8A" stroke-width="1.5"/>
    <text x="1150" y="430" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">GitHub</text>
    <text x="1150" y="448" font-size="12" fill="#F2F2F2" text-anchor="middle">[External Software System]</text>
    <text x="1150" y="472" font-size="12.5" fill="#ffffff" text-anchor="middle">Hosts the repository: Issues,</text>
    <text x="1150" y="488" font-size="12.5" fill="#ffffff" text-anchor="middle">Projects board, labels and</text>
    <text x="1150" y="504" font-size="12.5" fill="#ffffff" text-anchor="middle">collaborators. REST and GraphQL</text>
    <text x="1150" y="520" font-size="12.5" fill="#ffffff" text-anchor="middle">APIs, OAuth, webhooks.</text>
  </g>

  <!-- LLM Provider -->
  <g>
    <rect x="1020" y="640" width="260" height="140" rx="8" fill="#999999" stroke="#8A8A8A" stroke-width="1.5"/>
    <text x="1150" y="670" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">LLM Provider</text>
    <text x="1150" y="688" font-size="12" fill="#F2F2F2" text-anchor="middle">[External Software System]</text>
    <text x="1150" y="712" font-size="12.5" fill="#ffffff" text-anchor="middle">Hosted large language model API</text>
    <text x="1150" y="728" font-size="12.5" fill="#ffffff" text-anchor="middle">with tool calling. Replaceable</text>
    <text x="1150" y="744" font-size="12.5" fill="#ffffff" text-anchor="middle">without changes to the core logic.</text>
  </g>

  <!-- ============ Relationships ============ -->
  <g fill="none" stroke="#707070" stroke-width="1.5" stroke-dasharray="6 4">
    <path d="M250,262 L250,396" marker-end="url(#arrow)"/>            <!-- lead -> web -->
    <path d="M640,262 L640,396" marker-end="url(#arrow)"/>            <!-- dev -> backend -->
    <path d="M1150,262 L1150,396" marker-end="url(#arrow)"/>          <!-- member -> github -->
    <path d="M374,475 L496,475" marker-end="url(#arrow)"/>            <!-- web -> backend -->
    <path d="M610,564 L610,656" marker-end="url(#arrow)"/>            <!-- backend -> db -->
    <path d="M784,430 L1016,430" marker-end="url(#arrow)"/>           <!-- backend -> github -->
    <path d="M1016,500 L784,500" marker-end="url(#arrow)"/>           <!-- github -> backend -->
    <path d="M760,564 L760,710 L1016,710" marker-end="url(#arrow)"/>  <!-- backend -> llm -->
  </g>

  <!-- Relationship labels -->
  <g font-size="12.5" fill="#333333">
    <!-- lead -> web -->
    <text x="262" y="284">Reviews and approves proposals,</text>
    <text x="262" y="299">starts agents, views audit log</text>
    <text x="262" y="315" font-size="11.5" font-style="italic" fill="#666666">[HTTPS]</text>

    <!-- dev -> backend -->
    <text x="652" y="284">Runs evaluation scenarios</text>
    <text x="652" y="299">and exports the results</text>
    <text x="652" y="315" font-size="11.5" font-style="italic" fill="#666666">[REST API, HTTPS]</text>

    <!-- member -> github -->
    <text x="1162" y="284">Writes issues and</text>
    <text x="1162" y="299">comments; sees</text>
    <text x="1162" y="314">applied changes</text>
    <text x="1162" y="330" font-size="11.5" font-style="italic" fill="#666666">[Web browser]</text>

    <!-- web -> backend -->
    <text x="435" y="447" text-anchor="middle">Makes API calls</text>
    <text x="435" y="463" text-anchor="middle" font-size="11.5" font-style="italic" fill="#666666">[JSON, HTTPS]</text>

    <!-- backend -> db -->
    <text x="598" y="598" text-anchor="end">Stores runs, proposals</text>
    <text x="598" y="613" text-anchor="end">and audit records</text>
    <text x="598" y="629" text-anchor="end" font-size="11.5" font-style="italic" fill="#666666">[JDBC]</text>

    <!-- backend -> github -->
    <text x="915" y="362" text-anchor="middle">Reads repository data,</text>
    <text x="915" y="377" text-anchor="middle">applies approved actions,</text>
    <text x="915" y="392" text-anchor="middle">authenticates users</text>
    <text x="915" y="408" text-anchor="middle" font-size="11.5" font-style="italic" fill="#666666">[REST &amp; GraphQL, OAuth, HTTPS]</text>

    <!-- github -> backend -->
    <text x="900" y="522" text-anchor="middle">Notifies about new issues</text>
    <text x="900" y="538" text-anchor="middle" font-size="11.5" font-style="italic" fill="#666666">[Webhooks, HTTPS]</text>

    <!-- backend -> llm -->
    <text x="900" y="644" text-anchor="middle">Sends prompts and tool</text>
    <text x="900" y="659" text-anchor="middle">results; receives tool</text>
    <text x="900" y="674" text-anchor="middle">calls and proposals</text>
    <text x="900" y="690" text-anchor="middle" font-size="11.5" font-style="italic" fill="#666666">[HTTPS, JSON]</text>
  </g>

  <!-- ============ Legend ============ -->
  <g>
    <rect x="1020" y="812" width="260" height="156" rx="6" fill="none" stroke="#CCCCCC"/>
    <text x="1036" y="834" font-size="13" font-weight="bold" fill="#333333">Legend</text>
    <rect x="1036" y="846" width="36" height="18" rx="8" fill="#08427B"/>
    <text x="1084" y="860" font-size="12.5" fill="#333333">Person</text>
    <rect x="1036" y="870" width="36" height="18" rx="4" fill="#438DD5"/>
    <text x="1084" y="884" font-size="12.5" fill="#333333">Container</text>
    <rect x="1036" y="894" width="36" height="18" rx="4" fill="#999999"/>
    <text x="1084" y="908" font-size="12.5" fill="#333333">External software system</text>
    <rect x="1036" y="918" width="36" height="18" rx="4" fill="none" stroke="#444444" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="1084" y="932" font-size="12.5" fill="#333333">System boundary</text>
    <path d="M1036,951 L1070,951" fill="none" stroke="#707070" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="1084" y="955" font-size="12.5" fill="#333333">Relationship [technology]</text>
  </g>
</svg>
