# Профиль test: датасорс поднимает Testcontainers (@ServiceConnection), секреты — заглушки.
# Реальных значений здесь быть не должно.
app:
  github:
    app-id: "0"
    app-slug: test-app
    private-key-path: test-private-key.pem
    client-id: test-client-id
    client-secret: test-client-secret
  llm:
    base-url: http://localhost:11434/v1
    model: test-model
